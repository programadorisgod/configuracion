# ==============================================================================
# Linux Performance Kit - Universal Sysctl Tweaks (99-perf-kit.conf)
# Optimized for: 4-Core CPU, 8GB RAM + ZRAM, SATA SSD (DRAM-less), Dev/Multitask
# ==============================================================================

# --- MEMORIA VIRTUAL Y ZRAM ---
# Con ZRAM zstd de alta prioridad, swappiness alto permite mover páginas frías
# a la RAM comprimida (3:1 ratio) en lugar de descartar caché de archivos/código.
vm.swappiness = 180

# En ZRAM la latencia de búsqueda es 0: no leer clústeres adicionales de páginas.
vm.page-cluster = 0

# Mantener caché VFS de directorios/inodos por más tiempo (acelera git, IDEs, ls)
vm.vfs_cache_pressure = 50

# Desactivar compactación proactiva para eliminar picos de CPU imprevistos
vm.compaction_proactiveness = 0

# Desactivar aumentos bruscos de marcas de agua para evitar que kswapd sature la CPU
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

# 64 MB de reserva mínima de RAM para prevenir deadlocks bajo estrés
vm.min_free_kbytes = 65536

# Límite amplio de áreas de memoria mapeadas (necesario para IDEs, Electron, JVM, Steam/Proton)
vm.max_map_count = 1048576

# --- WRITEBACK / DISCO (Protege contra micro-congelamientos en SSD SATA DRAM-less) ---
# Escribir a disco en ráfagas pequeñas y constantes en vez de retener gigabytes en RAM
# que luego congelan el sistema al vaciarse en un SSD sin caché DRAM:
vm.dirty_bytes = 134217728
vm.dirty_background_bytes = 33554432
vm.dirty_writeback_centisecs = 1500
vm.dirty_expire_centisecs = 3000

# --- CPU Y PLANIFICADOR ---
# Desactivar watchdog NMI para ahorrar ciclos de CPU e interrupciones
kernel.nmi_watchdog = 0

# Autogroup: aísla procesos interactivos de compilaciones masivas en terminal
kernel.sched_autogroup_enabled = 1

# Evitar penalizar aplicaciones que usen split locks
kernel.split_lock_mitigate = 0

# --- RED DE ALTO RENDIMIENTO (Google BBR + Fair Queueing) ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 131072 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# --- FILE SYSTEM & WATCHERS (Desarrollo, Node, Python, Docker) ---
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152
