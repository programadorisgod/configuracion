# ==============================================================================
# Linux Performance Kit - Memory Management (THP & MGLRU) (perf-kit-mm.conf)
# ==============================================================================
# In 8GB RAM setups, THP "always" wastes memory creating 2MB pages for small apps.
# "madvise" enables huge pages ONLY when applications explicitly request them.
w- /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w- /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
w- /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - advise

# Multi-Gen LRU (MGLRU): protege el working set interactivo (navegador, IDE)
# evitando que descargas o copias de archivos desplacen la RAM activa
w- /sys/kernel/mm/lru_gen/enabled - - - - 0x0007
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
