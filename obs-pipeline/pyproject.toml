[project]
name = "obs-pipeline"
version = "0.1.0"
description = "Pipeline multiplataforma (Windows/Linux) de post-producción para OBS Studio"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "click>=8.1.7",
    "faster-whisper>=1.0.0",
    "pillow>=10.2.0",
    "watchdog>=4.0.0",
    "requests>=2.31.0",
]

[project.scripts]
obs-pipe = "obs_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
